# Low-memory profile for ~1 GB servers (Oracle Always Free VM.Standard.E2.1.Micro).
# Applied automatically by infrastructure/oracle/deploy.sh when RAM < 2 GB.
services:
  postgres:
    command: >
      postgres -c shared_buffers=32MB -c effective_cache_size=128MB -c work_mem=2MB
      -c maintenance_work_mem=16MB -c max_connections=25 -c max_wal_size=256MB -c wal_buffers=1MB
    mem_limit: 192m
  migrate:
    environment:
      NODE_OPTIONS: --max-old-space-size=160
    mem_limit: 256m
  backend:
    environment:
      NODE_OPTIONS: --max-old-space-size=192
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public&connection_limit=5
    mem_limit: 320m
  qr-web:
    environment:
      NODE_OPTIONS: --max-old-space-size=96
    mem_limit: 192m
  caddy:
    mem_limit: 64m
