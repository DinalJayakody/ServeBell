name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: servebell
          POSTGRES_PASSWORD: servebell_dev_password
          POSTGRES_DB: servebell
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U servebell" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - run: pnpm typecheck
      - name: Tests (shared, api-client, backend against Postgres)
        run: pnpm test
      - name: QR web production build
        run: pnpm --filter @servebell/qr-web build
      - name: Expo doctor
        run: |
          pnpm --filter @servebell/customer-app exec expo-doctor
          pnpm --filter @servebell/restaurant-app exec expo-doctor
